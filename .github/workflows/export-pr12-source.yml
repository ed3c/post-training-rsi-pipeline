name: Export PR12 Source

on:
  push:
    branches:
      - feat/coevolution-audit-recovery
    paths:
      - .github/workflows/export-pr12-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-audit-recovery
          fetch-depth: 0
      - name: Archive exact branch source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/pr12-source.tar.gz .
          git rev-parse HEAD >/tmp/pr12-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pr12-exact-source
          path: |
            /tmp/pr12-source.tar.gz
            /tmp/pr12-head.txt
          retention-days: 1
