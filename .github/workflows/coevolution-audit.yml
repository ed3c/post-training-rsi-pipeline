name: Co-Evolution Audit

on:
  pull_request:
    paths:
      - "src/post_training_rsi/audit/**"
      - "src/post_training_rsi/__main__.py"
      - "tests/test_coevolution_audit*.py"
      - "tests/test_architecture_manifest.py"
      - "tests/test_documentation_contract.py"
      - "docs/coevolution-audit-recovery.md"
      - "docs/architecture-manifest.json"
      - "README.md"
      - "AGENTS.md"
      - ".github/workflows/coevolution-audit.yml"
      - "scripts/check_mypy_delta.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          base_ref="${GITHUB_BASE_REF:-}"
          if [ -n "$base_ref" ]; then
            git fetch --no-tags origin "$base_ref"
            base_ref="origin/$base_ref"
          else
            base_ref="$(git rev-parse HEAD^)"
          fi
          python scripts/check_mypy_delta.py --base-ref "$base_ref"

      - name: Focused audit and documentation matrix
        run: |
          python -m pytest -q \
            tests/test_coevolution_audit.py \
            tests/test_coevolution_audit_cli.py \
            tests/test_architecture_manifest.py \
            tests/test_documentation_contract.py

      - name: Full suite and coverage floor
        run: |
          python -m pytest -q \
            --cov=post_training_rsi \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Read-only status and audit smoke
        shell: bash
        run: |
          set -euo pipefail
          workspace="/tmp/coevolution-audit-${{ matrix.python-version }}"
          rm -rf "$workspace"
          python -m post_training_rsi \
            --workspace "$workspace" \
            --run-id "audit-ci-${{ matrix.python-version }}" \
            coevolve >"/tmp/coevolution-audit-run-${{ matrix.python-version }}.json"
          python -m post_training_rsi \
            --workspace "$workspace" \
            coevolve-status >"/tmp/coevolution-status-${{ matrix.python-version }}.json"
          python -m post_training_rsi \
            --workspace "$workspace" \
            coevolve-audit >"/tmp/coevolution-audit-${{ matrix.python-version }}.json"
          python -m json.tool "/tmp/coevolution-status-${{ matrix.python-version }}.json" >/dev/null
          python -m json.tool "/tmp/coevolution-audit-${{ matrix.python-version }}.json" >/dev/null
          python - <<PY
          import json
          from pathlib import Path

          status = json.loads(
              Path('/tmp/coevolution-status-${{ matrix.python-version }}.json').read_text()
          )
          audit = json.loads(
              Path('/tmp/coevolution-audit-${{ matrix.python-version }}.json').read_text()
          )
          assert status['runtime_status'] == 'STOPPED', status
          assert status['state'] == 'STOPPED', status
          assert audit['status'] == 'PASS', audit
          report = Path(audit['report_path'])
          assert report.is_file(), audit
          assert report == Path('$workspace/reports/coevolution-audit.json')
          PY
