[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "post-training-rsi-pipeline"
version = "0.2.0"
description = "Evidence-first post-training, RSI, and model-harness co-evolution pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "ed3c"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/ed3c/post-training-rsi-pipeline"
Repository = "https://github.com/ed3c/post-training-rsi-pipeline"
Issues = "https://github.com/ed3c/post-training-rsi-pipeline/issues"

[project.optional-dependencies]
cloud = ["httpx>=0.27"]
semantic = ["numpy>=1.26", "sentence-transformers>=3"]
tracking = ["mlflow>=2.15"]
langgraph = ["langgraph>=0.2"]
training = [
  "torch>=2.3",
  "transformers>=4.56",
  "datasets>=2.20",
  "trl>=0.23",
  "accelerate>=0.34",
  "deepspeed>=0.15",
]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.16", "mypy>=1.11"]

[project.scripts]
post-training-rsi = "post_training_rsi.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
disallow_untyped_defs = true
no_implicit_optional = true
