name: PR11 State Dependency and Resume Metadata Repair

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic state dependency repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement, found {count}: {old[:120]!r}"
                  )
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "src/post_training_rsi/harness/model_inner_loop/policy.py",
              (
                  "        metadata: dict[str, JSONValue] = {\n"
                  "            \"candidate_checkpoint_id\": observation.checkpoint_id,\n"
              ),
              (
                  "        metadata: dict[str, JSONValue] = {\n"
                  "            # Preserve the exact trained Candidate identity so an\n"
                  "            # immutable approval pause can reconstruct and resume it.\n"
                  "            **dict(current.metadata),\n"
                  "            \"candidate_checkpoint_id\": observation.checkpoint_id,\n"
              ),
          )

          replace_once(
              "src/post_training_rsi/orchestration/coevolution.py",
              "        for index, iteration in enumerate(sorted(grouped)):\n",
              (
                  "        # Preserve producer-before-dependent insertion order across\n"
                  "        # iteration groups. A next-cycle Snapshot may reset iteration\n"
                  "        # to zero while depending on Evidence/Decision records from\n"
                  "        # the just-completed iteration, so numeric sorting is unsafe.\n"
                  "        for index, (iteration, iteration_records) in enumerate(\n"
                  "            grouped.items()\n"
                  "        ):\n"
              ),
          )
          replace_once(
              "src/post_training_rsi/orchestration/coevolution.py",
              "                    grouped[iteration],\n",
              "                    iteration_records,\n",
          )
          PY

      - name: Commit repair
        run: |
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add \
            src/post_training_rsi/harness/model_inner_loop/policy.py \
            src/post_training_rsi/orchestration/coevolution.py
          git commit -m 'fix(pr11): order dependent records and preserve Candidate metadata'
          git push origin HEAD:feat/coevolution-convergence
