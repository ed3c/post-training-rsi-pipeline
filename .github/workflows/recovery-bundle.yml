name: Recovery Bundle

on:
  pull_request:
    paths:
      - "src/post_training_rsi/recovery_bundle/**"
      - "tests/test_recovery_bundle*.py"
      - "tests/test_forensic_recovery_manifest.py"
      - "docs/forensic-recovery-bundle.md"
      - ".github/workflows/recovery-bundle.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-bundle:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Static validation
        run: |
          python -m compileall -q src tests
          ruff check src tests
          # The repository-wide mypy baseline still carries legacy errors from
          # earlier slices. This job asserts an exact-head pass for the boundary
          # it owns; the wider debt stays separately tracked.
          mypy src/post_training_rsi/recovery_bundle

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_recovery_bundle.py \
            tests/test_recovery_bundle_cli.py \
            tests/test_recovery_bundle_hardening.py \
            tests/test_forensic_recovery_manifest.py

      - name: Package CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/source/nested"
          printf '%s\n' '{"state":"STOPPED"}' > "$root/source/run.json"
          printf '%s\n' 'verified' > "$root/source/nested/evidence.txt"
          python -m post_training_rsi.recovery_bundle create \
            --source "$root/source" \
            --bundle "$root/bundle" \
            --source-label ci-recovery-bundle
          python -m post_training_rsi.recovery_bundle verify \
            --bundle "$root/bundle"
          python -m post_training_rsi.recovery_bundle stage \
            --bundle "$root/bundle" \
            --destination "$root/staged"
          python -m post_training_rsi.recovery_bundle verify-stage \
            --bundle "$root/bundle" \
            --destination "$root/staged"
          cmp "$root/source/run.json" "$root/staged/run.json"
          cmp "$root/source/nested/evidence.txt" "$root/staged/nested/evidence.txt"
