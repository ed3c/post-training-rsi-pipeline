name: PR11 Runtime Metadata and Approval Repair

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, 'fix(pr11): preserve model score and resume approvals') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Apply deterministic runtime repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/post_training_rsi/orchestration/coevolution.py")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  "from dataclasses import dataclass, replace\nfrom pathlib import Path\n",
                  "from dataclasses import dataclass, replace\nfrom datetime import datetime\nfrom pathlib import Path\n",
              ),
              (
                  "        if accepted_count < 1:\n"
                  "            accepted_count = _metadata_int(\n"
                  "                current,\n"
                  "                \"verified_trace_count\",\n"
                  "                self.config.co_evolution.target_traces,\n"
                  "            )\n"
                  "        request = ModelTrainingRequest.create(\n",
                  "        if accepted_count < 1:\n"
                  "            accepted_count = _metadata_int(\n"
                  "                current,\n"
                  "                \"verified_trace_count\",\n"
                  "                self.config.co_evolution.target_traces,\n"
                  "            )\n"
                  "        policy_input = replace(\n"
                  "            current,\n"
                  "            metadata={\n"
                  "                **dict(current.metadata),\n"
                  "                \"active_model_score\": metadata.active_model_score,\n"
                  "                \"active_harness_id\": metadata.active_harness_id,\n"
                  "            },\n"
                  "        )\n"
                  "        request = ModelTrainingRequest.create(\n",
              ),
              (
                  "        trained_step = policy.training_completed(\n"
                  "            current,\n"
                  "            execution.bundle.candidate,\n"
                  "        )\n",
                  "        trained_step = policy.training_completed(\n"
                  "            policy_input,\n"
                  "            execution.bundle.candidate,\n"
                  "        )\n",
              ),
              (
                  "        status = self.approval_service.status(\n"
                  "            request_id,\n"
                  "            as_of=self.clock.at(cycle=current.cycle, ordinal=9_500),\n"
                  "        )\n",
                  "        as_of = self.clock.at(cycle=current.cycle, ordinal=9_500)\n"
                  "        if self.approval_service.store.has_decision(request_id):\n"
                  "            stored_decision = self.approval_service.store.load_decision(\n"
                  "                request_id\n"
                  "            )\n"
                  "            as_of = _later_timestamp(as_of, stored_decision.decided_at)\n"
                  "        status = self.approval_service.status(\n"
                  "            request_id,\n"
                  "            as_of=as_of,\n"
                  "        )\n",
              ),
              (
                  "\ndef _record_id(prefix: str, run_id: str, iteration: int, subject: str) -> str:\n",
                  "\ndef _later_timestamp(first: str, second: str) -> str:\n"
                  "    first_value = datetime.fromisoformat(first.replace(\"Z\", \"+00:00\"))\n"
                  "    second_value = datetime.fromisoformat(second.replace(\"Z\", \"+00:00\"))\n"
                  "    return first if first_value >= second_value else second\n"
                  "\n\n"
                  "def _record_id(prefix: str, run_id: str, iteration: int, subject: str) -> str:\n",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement, found {count}: {old[:80]!r}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit runtime repairs
        run: |
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add src/post_training_rsi/orchestration/coevolution.py
          git commit -m 'fix(pr11): preserve model score and resume approvals'
          git push origin HEAD:feat/coevolution-convergence
