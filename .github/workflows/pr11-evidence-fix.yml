name: PR11 Model Evidence Dependency Repair

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Bind policy observations to persisted EvidenceRecords
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/post_training_rsi/orchestration/coevolution.py")
          text = path.read_text(encoding="utf-8")

          old = (
              "        trained_step = policy.training_completed(\n"
              "            policy_input,\n"
              "            execution.bundle.candidate,\n"
              "        )\n"
          )
          new = (
              "        policy_candidate = replace(\n"
              "            execution.bundle.candidate,\n"
              "            evidence_ids=tuple(\n"
              "                evidence.evidence_id for evidence in training_evidence\n"
              "            ),\n"
              "        )\n"
              "        trained_step = policy.training_completed(\n"
              "            policy_input,\n"
              "            policy_candidate,\n"
              "        )\n"
          )
          if text.count(old) != 1:
              raise SystemExit(
                  "training policy call replacement did not match exactly once"
              )
          text = text.replace(old, new)

          old = (
              "        evaluated_step = policy.evaluation_completed(\n"
              "            trained_step.final_snapshot,\n"
              "            execution.bundle.evaluation,\n"
              "        )\n"
          )
          new = (
              "        policy_evaluation = replace(\n"
              "            execution.bundle.evaluation,\n"
              "            evidence_ids=tuple(\n"
              "                evidence.evidence_id for evidence in evaluation_evidence\n"
              "            ),\n"
              "        )\n"
              "        evaluated_step = policy.evaluation_completed(\n"
              "            trained_step.final_snapshot,\n"
              "            policy_evaluation,\n"
              "        )\n"
          )
          if text.count(old) != 1:
              raise SystemExit(
                  "evaluation policy call replacement did not match exactly once"
              )
          text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit repair
        run: |
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add src/post_training_rsi/orchestration/coevolution.py
          git commit -m 'fix(pr11): bind model policy to committed evidence'
          git push origin HEAD:feat/coevolution-convergence
