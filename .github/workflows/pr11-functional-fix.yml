name: PR11 Functional Convergence Repair

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  repair:
    if: "${{ !contains(github.event.head_commit.message, 'fix(pr11): repair durable') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed deterministic repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "src/post_training_rsi/harness/persistence.py",
              "        spec_bytes = canonical_json_bytes(spec.to_dict())\n",
              "        # Store the exact canonical bytes used by HarnessSpec.content_sha256.\n"
              "        # canonical_json_bytes adds a trailing newline and therefore belongs\n"
              "        # to manifest files, not the content-addressed Harness payload.\n"
              "        spec_bytes = spec.to_json().encode(\"utf-8\")\n",
          )
          replace(
              "src/post_training_rsi/verification/safety.py",
              "        \"ignore previous instructions\",\n",
              "        \"ignore previous instructions\",\n"
              "        \"ignore all previous instructions\",\n",
          )
          replace(
              "src/post_training_rsi/__main__.py",
              "    subparsers.add_parser(\n"
              "        \"coevolve\",\n"
              "        help=(\n"
              "            \"run or resume the deterministic durable Model/Harness \"\n"
              "            \"Co-Evolution reference runtime\"\n"
              "        ),\n"
              "    )\n",
              "    coevolve = subparsers.add_parser(\n"
              "        \"coevolve\",\n"
              "        help=(\n"
              "            \"run or resume the deterministic durable Model/Harness \"\n"
              "            \"Co-Evolution reference runtime\"\n"
              "        ),\n"
              "        description=(\n"
              "            \"Run the deterministic durable Model/Harness Co-Evolution \"\n"
              "            \"reference runtime. This command does not claim real GPU, \"\n"
              "            \"cloud provider, or production benchmark execution.\"\n"
              "        ),\n"
              "    )\n"
              "    coevolve.set_defaults(runtime_kind=\"deterministic-reference\")\n",
          )
          replace(
              "src/post_training_rsi/__main__.py",
              "        result = build_default_engine(config, workspace=workspace).run()\n"
              "        _print_json(result.to_dict())\n",
              "        demo_result = build_default_engine(config, workspace=workspace).run()\n"
              "        _print_json(demo_result.to_dict())\n",
          )
          replace(
              "src/post_training_rsi/__main__.py",
              "        result = build_converged_rsi_controller(\n"
              "            config,\n"
              "            workspace=workspace,\n"
              "            run_id=args.run_id,\n"
              "        ).run()\n"
              "        _print_json(result.to_dict())\n",
              "        rsi_result = build_converged_rsi_controller(\n"
              "            config,\n"
              "            workspace=workspace,\n"
              "            run_id=args.run_id,\n"
              "        ).run()\n"
              "        _print_json(rsi_result.to_dict())\n",
          )
          replace(
              "src/post_training_rsi/__main__.py",
              "        result = build_reference_coevolution_controller(\n"
              "            config,\n"
              "            workspace=workspace,\n"
              "            run_id=args.run_id,\n"
              "        ).run()\n"
              "        _print_json(result.to_dict())\n",
              "        coevolution_result = build_reference_coevolution_controller(\n"
              "            config,\n"
              "            workspace=workspace,\n"
              "            run_id=args.run_id,\n"
              "        ).run()\n"
              "        _print_json(coevolution_result.to_dict())\n",
          )
          replace(
              "tests/test_documentation_contract.py",
              "    \"rsi\",\n",
              "    \"rsi\",\n    \"coevolve\",\n",
          )
          replace(
              "tests/test_documentation_contract.py",
              "    assert SUPPORTED_COMMANDS <= commands\n"
              "    assert \"coevolve\" not in commands\n\n"
              "    readme = _read(\"README.md\")\n"
              "    convergence = _read(\"docs/rsi-convergence.md\")\n"
              "    status = _read(\"docs/implementation-status.md\")\n"
              "    for command in SUPPORTED_COMMANDS:\n"
              "        assert f\"`{command}`\" in readme\n"
              "        assert command in convergence\n"
              "        assert f\"`{command}`\" in status\n",
              "    assert commands == SUPPORTED_COMMANDS\n\n"
              "    readme = _read(\"README.md\")\n"
              "    convergence = _read(\"docs/rsi-convergence.md\")\n"
              "    coevolution = _read(\"docs/coevolution-convergence.md\")\n"
              "    status = _read(\"docs/implementation-status.md\")\n"
              "    for command in SUPPORTED_COMMANDS - {\"coevolve\"}:\n"
              "        assert f\"`{command}`\" in readme\n"
              "        assert command in convergence\n"
              "        assert f\"`{command}`\" in status\n"
              "    assert \"`coevolve`\" in readme\n"
              "    assert \"coevolve\" in coevolution\n"
              "    assert \"`coevolve`\" in status\n",
          )

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          text = text.replace(
              "Current integration branch: `feat/rsi-convergence`  \n"
              "Draft integration PR: [#7 — converge RSI runtime contracts](https://github.com/ed3c/post-training-rsi-pipeline/pull/7)",
              "Current integration branch: `feat/coevolution-convergence`  \n"
              "Draft integration PR: [#11 — converge durable Model/Harness Co-Evolution](https://github.com/ed3c/post-training-rsi-pipeline/pull/11)",
          )
          text = text.replace(
              "| Model/Harness Co-Evolution | Not yet supported | Harness components may exist, but no `coevolve` CLI or converged outer/middle/inner loop |",
              "| Model/Harness Co-Evolution | Supported deterministic reference | `coevolve` composes frozen-model Harness search, observable Trace harvesting, model inner-loop evaluation, durable resume, pointer history, and rollback/stop guards |",
          )
          marker = "  rsi\n```\n\nVerify a JSONL Dataset:"
          insertion = (
              "  rsi\n```\n\n"
              "Run or resume the deterministic Co-Evolution reference runtime:\n\n"
              "```bash\n"
              "post-training-rsi \\\n"
              "  --config configs/pipeline.example.json \\\n"
              "  --workspace artifacts/coevolution \\\n"
              "  --run-id coevolution-local-001 \\\n"
              "  coevolve\n"
              "```\n\nVerify a JSONL Dataset:"
          )
          if marker not in text:
              raise SystemExit("README RSI quick-start marker not found")
          text = text.replace(marker, insertion, 1)
          text = text.replace(
              "`make coevolve` remains intentionally red until a supported Co-Evolution command lands.",
              "`make coevolve` runs the deterministic local reference composition. It does not authorize real GPU, cloud endpoint, production benchmark, or autonomous Git mutation.",
          )
          text = text.replace(
              "CLI dispatch: demo/rsi/verify/audit/approvals/review",
              "CLI dispatch: demo/rsi/coevolve/verify/audit/approvals/review",
          )
          text = text.replace(
              "future Co-Evolution components; not CLI-converged",
              "outer/middle/inner Co-Evolution components and durable persistence",
          )
          readme.write_text(text, encoding="utf-8")

          status = Path("docs/implementation-status.md")
          text = status.read_text(encoding="utf-8")
          text = text.replace(
              "Status snapshot: Draft PR #7, branch `feat/rsi-convergence`",
              "Status snapshot: Draft PR #11, branch `feat/coevolution-convergence`",
          )
          text = text.replace(
              "## 1. Supported CLI surface on PR #7",
              "## 1. Supported CLI surface on PR #11",
          )
          text = text.replace(
              "| `coevolve` | Planned | no supported CLI or converged Model/Harness outer/middle/inner loop |",
              "| `coevolve` | Supported deterministic reference | durable local outer/middle/inner composition with resume, evidence, pointer history, rollback, and terminal guards; no real GPU/cloud claim |",
          )
          text = text.replace(
              "Support here means reachable on `feat/rsi-convergence`, not on `main`.",
              "Support here means reachable on `feat/coevolution-convergence`, not on `main`.",
          )
          text = text.replace(
              "| CAP-COEV-01 | Harness mutation outer loop | Planned integration | component files may exist | no supported State Machine/CLI convergence |",
              "| CAP-COEV-01 | Harness mutation outer loop | Supported deterministic reference | frozen model, deterministic mutation/validation/evaluation, strict acceptance, approval and plateau handoff | production task suite and real tool execution not verified |",
          )
          text = text.replace(
              "| CAP-COEV-02 | successful trace harvesting | Planned integration | component files may exist | no supported middle-loop evidence graph |",
              "| CAP-COEV-02 | successful observable trace harvesting | Supported deterministic reference | lineage-bound observable traces, common verification gates, immutable Trace Dataset and evidence | production privacy/representativeness not verified |",
          )
          text = text.replace(
              "| CAP-COEV-03 | model inner loop and hot-swap | Planned | target architecture only | PR #10/#11 required |",
              "| CAP-COEV-03 | model inner loop and hot-swap | Supported deterministic reference | exact Dataset/artifact/endpoint integrity, promotion/rollback commit separation, pointer update and next-cycle handoff | real gradient update and live serving not verified |",
          )
          text = text.replace(
              "- complete Model/Harness Co-Evolution;",
              "- production-grade or externally validated Model/Harness Co-Evolution;",
          )
          status.write_text(text, encoding="utf-8")
          PY
      - name: Commit repairs
        run: |
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add README.md docs/implementation-status.md tests/test_documentation_contract.py src/post_training_rsi
          git commit -m 'fix(pr11): repair durable Co-Evolution runtime and command truth'
          git push origin HEAD:feat/coevolution-convergence
