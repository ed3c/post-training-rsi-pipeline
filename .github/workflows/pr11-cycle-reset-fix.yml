name: PR11 Next-Cycle Record Iteration Repair

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Align Harness-slim records with next-cycle iteration zero
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/post_training_rsi/orchestration/coevolution.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    def _slim_harness_after_model_promotion(")
          end = text.index("    def _begin_outer_cycle(", start)
          section = text[start:end]
          count = section.count("current.iteration")
          if count < 6:
              raise SystemExit(
                  f"expected at least six current.iteration uses in slim section, found {count}"
              )
          section = section.replace("current.iteration", "0")
          path.write_text(text[:start] + section + text[end:], encoding="utf-8")
          PY

      - name: Commit repair
        run: |
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add src/post_training_rsi/orchestration/coevolution.py
          git commit -m 'fix(pr11): commit Harness slimming in next-cycle iteration zero'
          git push origin HEAD:feat/coevolution-convergence
