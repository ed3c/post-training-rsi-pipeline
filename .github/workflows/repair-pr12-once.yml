name: Repair PR12 Once

on:
  push:
    branches:
      - feat/coevolution-audit-recovery
    paths:
      - .github/workflows/repair-pr12-once.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR12 branch
        uses: actions/checkout@v4
        with:
          ref: feat/coevolution-audit-recovery
          fetch-depth: 0

      - name: Apply deterministic audit repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          audit = Path("src/post_training_rsi/audit/coevolution.py")
          text = audit.read_text(encoding="utf-8")
          replacements = {
              "from ..control_plane import DecisionSubject, StateSnapshot\n": (
                  "from ..control_plane import StateSnapshot\n"
              ),
              "                        subject=metadata.pending_approval_subject,\n": (
                  "                        approval_subject=metadata.pending_approval_subject,\n"
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected audit repair target not found: {old!r}")
              text = text.replace(old, new, 1)
          audit.write_text(text, encoding="utf-8")

          tests = Path("tests/test_coevolution_audit.py")
          text = tests.read_text(encoding="utf-8")
          old = "import pytest\n\n"
          if old not in text:
              raise SystemExit("expected unused pytest import not found")
          tests.write_text(text.replace(old, "", 1), encoding="utf-8")

          cli = Path("src/post_training_rsi/__main__.py")
          text = cli.read_text(encoding="utf-8")
          replacements = {
              "        result = build_default_engine(config, workspace=workspace).run()\n"
              "        _print_json(result.to_dict())\n": (
                  "        demo_result = build_default_engine(config, workspace=workspace).run()\n"
                  "        _print_json(demo_result.to_dict())\n"
              ),
              "        result = build_converged_rsi_controller(\n"
              "            config,\n"
              "            workspace=workspace,\n"
              "            run_id=args.run_id,\n"
              "        ).run()\n"
              "        _print_json(result.to_dict())\n": (
                  "        rsi_result = build_converged_rsi_controller(\n"
                  "            config,\n"
                  "            workspace=workspace,\n"
                  "            run_id=args.run_id,\n"
                  "        ).run()\n"
                  "        _print_json(rsi_result.to_dict())\n"
              ),
              "        result = build_reference_coevolution_controller(\n"
              "            config,\n"
              "            workspace=workspace,\n"
              "            run_id=args.run_id,\n"
              "        ).run()\n"
              "        _print_json(result.to_dict())\n": (
                  "        coevolution_result = build_reference_coevolution_controller(\n"
                  "            config,\n"
                  "            workspace=workspace,\n"
                  "            run_id=args.run_id,\n"
                  "        ).run()\n"
                  "        _print_json(coevolution_result.to_dict())\n"
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"expected CLI repair target not found: {old!r}")
              text = text.replace(old, new, 1)
          cli.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/repair-pr12-once.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate repair
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          python scripts/check_mypy_delta.py \
            --base-ref origin/feat/coevolution-convergence
          python -m pytest -q \
            tests/test_coevolution_audit.py \
            tests/test_coevolution_audit_cli.py \
            tests/test_architecture_manifest.py \
            tests/test_documentation_contract.py
          python -m pytest -q \
            --cov=post_training_rsi \
            --cov-report=term-missing \
            --cov-fail-under=75
          workspace=/tmp/pr12-repair-smoke
          rm -rf "$workspace"
          python -m post_training_rsi \
            --workspace "$workspace" \
            --run-id pr12-repair \
            coevolve >/tmp/pr12-coevolve.json
          python -m post_training_rsi \
            --workspace "$workspace" \
            coevolve-status >/tmp/pr12-status.json
          python -m post_training_rsi \
            --workspace "$workspace" \
            coevolve-audit >/tmp/pr12-audit.json
          python -m json.tool /tmp/pr12-status.json >/dev/null
          python -m json.tool /tmp/pr12-audit.json >/dev/null

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ed3c"
          git config user.email "mcnum01@gmail.com"
          git add \
            src/post_training_rsi/audit/coevolution.py \
            src/post_training_rsi/__main__.py \
            tests/test_coevolution_audit.py \
            .github/workflows/repair-pr12-once.yml
          git commit -m "fix(audit): satisfy exact-head static validation"
          git push origin HEAD:feat/coevolution-audit-recovery
