name: Recovery Activation Plan

on:
  pull_request:
    paths:
      - "src/post_training_rsi/recovery_activation/**"
      - "tests/test_recovery_activation.py"
      - "tests/test_recovery_activation_cli.py"
      - "tests/test_recovery_activation_manifest.py"
      - "docs/recovery-activation-plan.md"
      - "docs/recovery-activation-manifest.json"
      - ".github/workflows/recovery-activation-plan.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-activation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Static validation
        run: |
          python -m compileall -q src tests
          ruff check src tests
          mypy src

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_recovery_activation.py \
            tests/test_recovery_activation_cli.py \
            tests/test_recovery_activation_manifest.py

      - name: No-activation CLI assertion
        shell: bash
        run: |
          set -euo pipefail
          python -m post_training_rsi.recovery_activation --help > /tmp/recovery-help.txt
          grep -q "build" /tmp/recovery-help.txt
          grep -q "verify" /tmp/recovery-help.txt
          grep -q "preflight" /tmp/recovery-help.txt
          if grep -Eq "activate|apply|switch|resume|rollback" /tmp/recovery-help.txt; then
            echo "Forbidden recovery execution command found in package CLI help"
            exit 1
          fi
