name: PR11 Rollback Transaction Iteration Repair

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true

      - name: Normalize rollback commit records to the producer iteration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/post_training_rsi/orchestration/coevolution.py")
          text = path.read_text(encoding="utf-8")
          old = (
              "        rollback_step = self._model_policy().rollback_committed(\n"
              "            current,\n"
              "            ModelRollbackCommitObservation(\n"
              "                rejected_checkpoint_id=decision.subject_id,\n"
              "                active_checkpoint_id=metadata.active_checkpoint_id,\n"
              "                completed_at=rollback_evidence.created_at,\n"
              "                evidence_ids=(rollback_evidence.evidence_id,),\n"
              "            ),\n"
              "        )\n"
              "        committed = self._commit_step(\n"
          )
          new = (
              "        rollback_step = self._model_policy().rollback_committed(\n"
              "            current,\n"
              "            ModelRollbackCommitObservation(\n"
              "                rejected_checkpoint_id=decision.subject_id,\n"
              "                active_checkpoint_id=metadata.active_checkpoint_id,\n"
              "                completed_at=rollback_evidence.created_at,\n"
              "                evidence_ids=(rollback_evidence.evidence_id,),\n"
              "            ),\n"
              "        )\n"
              "        # The pure inner-loop policy resets the next cycle to iteration 0.\n"
              "        # Persistence, however, must first commit the rollback Evidence and\n"
              "        # its dependent Decision/Transition/Snapshot in the producer\n"
              "        # iteration. The following outer-cycle start creates iteration-0\n"
              "        # records separately, after this transaction is committed.\n"
              "        rollback_snapshot = replace(\n"
              "            rollback_step.final_snapshot,\n"
              "            snapshot_id=_record_id(\n"
              "                \"snapshot-model-rollback-committed\",\n"
              "                self.run_id,\n"
              "                current.iteration,\n"
              "                decision.subject_id,\n"
              "            ),\n"
              "            iteration=current.iteration,\n"
              "        )\n"
              "        rollback_step = replace(\n"
              "            rollback_step,\n"
              "            snapshots=(rollback_snapshot,),\n"
              "        )\n"
              "        committed = self._commit_step(\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected one rollback block, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit repair
        run: |
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add src/post_training_rsi/orchestration/coevolution.py
          git commit -m 'fix(pr11): commit rollback records before next-cycle reset'
          git push origin HEAD:feat/coevolution-convergence
