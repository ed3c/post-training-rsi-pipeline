name: PR11 Temporary Ruff Autofix

on:
  push:
    branches:
      - feat/coevolution-convergence

permissions:
  contents: write

jobs:
  ruff-autofix:
    if: ${{ !contains(github.event.head_commit.message, 'style(pr11): apply Ruff autofixes') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/coevolution-convergence
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic Ruff fixes
        run: |
          python -m pip install --upgrade pip ruff
          ruff check src tests --fix --unsafe-fixes
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No Ruff changes required.'
            exit 0
          fi
          git config user.name 'ed3c'
          git config user.email 'mcnum01@gmail.com'
          git add src tests
          git commit -m 'style(pr11): apply Ruff autofixes'
          git push origin HEAD:feat/coevolution-convergence
